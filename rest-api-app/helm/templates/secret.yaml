apiVersion: v1
kind: Secret
metadata:
  name: {{ tpl (toYaml .Values.metadata.name) . }}
  labels:
    {{- tpl (toYaml .Values.metadata.labels) . | nindent 4 }}
type: Opaque
data:
  PGVECTOR_USER_NAME: {{ .Values.PGVECTOR_USER_NAME | b64enc | quote }}
  PGVECTOR_PASSWORD: {{ .Values.PGVECTOR_PASSWORD | b64enc | quote }}
 